name: Meimodu自动签到-账号2

on:
  workflow_dispatch:

jobs:
  signin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置Python环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 执行签到
      env:
        EMAIL: ${{ secrets.EMAIL2 }}
        PASSWORD: ${{ secrets.PASSWORD2 }}
        TARGET_URL: ${{ secrets.TARGET_URL }}
        ANONYMOUS: ${{ vars.ANONYMOUS }}
      run: |
        python main.py

    - name: 上传日志文件
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: signin-logs-account2
        path: |
          logs/
        retention-days: 7
